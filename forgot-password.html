<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — FraudGuard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      background: white;
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="font-size: 1.8rem; font-weight: 800; color: var(--text-main);">🛡️ FraudGuard</div>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Reset Account Password</p>
    </div>

    <form onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="reset-email">Email Address</label>
        <input type="email" id="reset-email" class="form-control" placeholder="name@company.com" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem;">
        SEND RESET LINK
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 0.9rem;">
      <a href="login.html" style="font-weight: 600;">Back to login</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      showToast(`Password reset link sent to ${email} (Demo feature).`, 'info');
      setTimeout(() => window.location.href = 'login.html', 1500);
    }
  </script>
</body>
</html>
