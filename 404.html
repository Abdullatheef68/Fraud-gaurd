<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Signal Not Found — FraudGuard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .error-card {
      background: white;
      color: var(--text-main);
      padding: 50px 40px;
      border-radius: var(--radius-lg);
      max-width: 460px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div style="font-size: 4rem; margin-bottom: 10px;">🛡️ 404</div>
    <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; color: var(--text-main);">Signal Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem;">The page or resource you requested could not be located on the platform.</p>
    <a href="dashboard.html" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem;">RETURN TO DASHBOARD</a>
  </div>
</body>
</html>
